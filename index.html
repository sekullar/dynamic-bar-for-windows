<!doctype html>
<html lang="tr"><head><meta charset="utf-8">
<style>
  :root { --ease: cubic-bezier(.34,1.45,.5,1); --soft: cubic-bezier(.22,.9,.3,1); --body:#ffc2d9; --ear:#ffadcc; --cheek:#ff8fb8; --bg:#000; --bga:100; --sh1:0 1px 5px rgba(0,0,0,.25); --sh2:0 3px 12px rgba(0,0,0,.3); --ui:1; --top:10px; }
  #stage { position:absolute; left:50%; top:0; width:0; height:0; transform:scale(var(--ui)); transform-origin:0 0; }
  html,body { margin:0; background:transparent; overflow:hidden; font-family:"Segoe UI Variable","Segoe UI",system-ui,sans-serif; user-select:none; }
  #island { position:absolute; top:var(--top); left:0; transform:translateX(-50%); width:112px; height:36px; border-radius:18px; background:color-mix(in srgb, var(--bg) calc(var(--bga) * 1%), transparent); color:#fff;
    display:flex; align-items:center; gap:10px; padding:0 8px; box-sizing:border-box; overflow:hidden; box-shadow:var(--sh1);
    transition: width .6s var(--ease), height .6s var(--ease), border-radius .6s var(--ease), padding .6s var(--ease), top .4s var(--soft); }
  #island.expanded { width:400px; height:78px; border-radius:30px; padding:0 16px 0 14px; }
  #island.open { width:420px; height:136px; }
  body[data-mode=dock] #island { top:0; border-radius:0 0 18px 18px; }
  body[data-mode=dock] #island.expanded, body[data-mode=dock] #island.open { border-radius:0 0 30px 30px; }
  #mascot { width:30px; height:30px; flex:none; transition: transform .6s var(--ease); animation: breathe 3.2s ease-in-out infinite; }
  #island.expanded #mascot { transform:scale(1.55); margin-right:10px; animation-name:breatheBig; }
  .dots { margin-left:auto; display:flex; gap:4px; transition:opacity .25s; }
  .dots i { width:4px; height:4px; border-radius:50%; background:#ffffff55; animation:pulse 1.8s infinite; }
  .dots i:nth-child(2){animation-delay:.2s} .dots i:nth-child(3){animation-delay:.4s}
  #island.expanded .dots { opacity:0; }
  #content { position:absolute; left:74px; right:18px; top:0; bottom:0; display:flex; flex-direction:column; justify-content:center;
    opacity:0; filter:blur(6px); transform:translateY(6px); transition: opacity .25s, filter .25s, transform .35s var(--soft); pointer-events:none; }
  #island.expanded #content { opacity:1; filter:none; transform:none; transition-delay:.15s; }
  #island.open #content { opacity:0; transition-delay:0s; }
  #content.swap { opacity:0 !important; filter:blur(6px) !important; transition-delay:0s !important; }
  #title { font-size:15px; font-weight:650; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #text { font-size:12.5px; color:#ffffffb0; margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #bar { height:3px; border-radius:2px; background:#ffffff22; margin-top:7px; display:none; }
  #bar b { display:block; height:100%; width:0; border-radius:2px; background:var(--body); transition:width .3s linear; }
  /* kargo: ilerleme çubuğunun ucunda paket gider, sonunda hedef simgesi bekler; teslimde simge zıplar */
  #bar { position:relative; }
  #bar b { position:relative; }
  #rdest { display:none; position:absolute; right:-3px; top:-13px; font-size:14px; line-height:1; }
  #island.parcel #rdest { display:block; }
  #island.parcel #bar b::after { content:'📦'; position:absolute; right:-7px; top:-12px; font-size:12px; line-height:1; animation: carry .34s ease-in-out infinite; }
  #island.parcel.delivered #bar b::after { display:none; }
  #rdest.pop { animation: destpop .7s var(--ease); }
  @keyframes carry { 50% { transform:translateY(-2px); } }
  @keyframes destpop { 35% { transform:scale(1.6) rotate(-10deg); } 65% { transform:scale(.9) rotate(4deg); } }
  /* kargocu maskot: şapka ve koli belirir, koşar gibi sekerek ilerler; koli yukarıdan düşüp yakalanır */
  .courier { opacity:0; transform:translateY(8px) scale(.6); transform-box:fill-box; transform-origin:50% 100%; transition:opacity .2s, transform .5s var(--ease); pointer-events:none; }
  .courier .cap { fill:#e0524d; } .courier .capv { fill:#b93f3b; }
  .courier .box rect { fill:#c99b64; stroke:#a07a47; stroke-width:.7; } .courier .tape { stroke:#f1dcae; stroke-width:1.6; fill:none; }
  .courier .cpaw { fill:var(--body); stroke:var(--ear); stroke-width:.6; }
  #mascot[data-mood=courier] .courier { opacity:1; transform:none; animation:run .34s ease-in-out infinite; }
  #mascot[data-mood=courier] .courier .box { transform-box:fill-box; transform-origin:50% 100%; animation:boxdrop .7s var(--ease) both; }
  #mascot[data-mood=courier] .body-g { animation:run .34s ease-in-out infinite; }
  @keyframes run { 0%,100% { transform:translateY(0) rotate(-2deg); } 50% { transform:translateY(-2.4px) rotate(2deg); } }
  @keyframes boxdrop { 0% { transform:translateY(-22px) scale(.7); opacity:0; } 60% { transform:translateY(1px) scale(1.06,.92); opacity:1; } 100% { transform:none; opacity:1; } }

  /* panel (boşta tıklayınca açılır) */
  #panel { position:absolute; left:74px; right:16px; top:14px; bottom:10px; overflow:hidden; opacity:0; pointer-events:none; transition:opacity .25s; }
  #island.open #panel { opacity:1; pointer-events:auto; transition-delay:.25s; }
  #track { display:flex; height:calc(100% - 16px); transition:transform .5s var(--soft); }
  /* min-width:0 şart: yoksa uzun bir şarkı adı bölümü panelden geniş yapar ve sonraki tüm sayfalar görünür alanın dışına kayar */
  #track section { flex:0 0 100%; min-width:0; max-width:100%; display:flex; flex-direction:column; justify-content:center; }
  #clock { font-size:36px; font-weight:600; letter-spacing:1px; line-height:1; }
  #date { font-size:12.5px; color:#ffffffa0; margin-top:6px; text-transform:capitalize; }
  .lbl { font-size:12.5px; color:#ffffffa0; margin-bottom:10px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; }
  .row button { background:#ffffff14; color:#fff; border:0; border-radius:12px; padding:8px 13px; font:inherit; font-size:12.5px; cursor:pointer; transition:background .2s, transform .25s var(--ease); }
  .row button:hover { background:#ffffff28; transform:translateY(-1px); }
  .row button.sw { width:24px; height:24px; padding:0; border-radius:50%; border:2px solid transparent; }
  .row button.sw.on { border-color:#fff; }
  .pdots { position:absolute; bottom:0; left:0; right:0; display:flex; justify-content:center; gap:6px; transform:translateX(-29px); } /* panel adanın sağına kayık (sol 74px, sağ 16px): noktaları adanın ortasına hizala */
  .pdots i { width:5px; height:5px; border-radius:3px; background:#ffffff33; cursor:pointer; transition:width .3s var(--ease), background .3s; }
  .pdots i.on { width:15px; background:#fff; }
  #close { z-index:5; position:absolute; top:9px; right:12px; width:22px; height:22px; border:0; border-radius:50%; background:#ffffff18; color:#fff; font-size:10px; cursor:pointer; opacity:0; pointer-events:none; transition:opacity .25s; }
  #island.open #close { opacity:1; pointer-events:auto; }

  /* maskot */
  .body { fill:var(--body); } .ear { fill:var(--ear); } .cheek { fill:var(--cheek); opacity:.55; } .eye { fill:#2a1a24; }
  .mouth { fill:none; stroke:#2a1a24; stroke-width:1.6; stroke-linecap:round; }
  .eye { transform-box:fill-box; transform-origin:center; animation:blink 4.5s infinite; }
  .zzz { opacity:0; font:700 7px sans-serif; fill:#ffffffaa; }
  .body-g { transform-box:fill-box; transform-origin:50% 90%; }
  #mascot[data-mood=happy] .body-g { animation:hop .7s var(--ease) 2; }
  #mascot[data-mood=alert] .body-g { animation:wiggle .4s ease-in-out 4; }
  #mascot[data-mood=sleep] .eye { animation:none; transform:scaleY(.12); }
  #mascot[data-mood=sleep] .zzz { opacity:1; animation:pulse 2.4s infinite; }
  /* Claude Code maskotuna dönüşüm: pembe maskot küçülüp kaybolur, turuncu blok maskot pırıltıyla belirir, sonra geri döner */
  .lap { opacity:0; transform:translate(6px,8px); transform-box:fill-box; transition:opacity .3s, transform .6s var(--ease); }
  .lap .lid { fill:#3b3b44; stroke:#6a6a78; stroke-width:.7; } .lap .lgo { fill:#d97757; } .lap .lbase { fill:#55555f; }
  .lap .paw { fill:var(--body); stroke:var(--ear); stroke-width:.6; }
  .lap .code { font:700 5.5px ui-monospace,Consolas,monospace; fill:#8fe3a8; opacity:0; }
  /* çalışan maskot: yarım profil, laptoba doğru eğilmiş, kaşları çatık. Laptop sağda ve yüzü kapatmıyor (arkası ve Claude logosu görünür) */
  .brow, .focusm { fill:none; stroke:#2a1a24; stroke-linecap:round; opacity:0; transition:opacity .3s; } .brow { stroke-width:1.3; } .focusm { stroke-width:1.5; }
  .glow { fill:url(#glowg); opacity:0; transition:opacity .4s; pointer-events:none; }
  .think, .mag, .mug, .chinpaw { opacity:0; transition:opacity .25s; pointer-events:none; }
  .think circle { fill:#fff; opacity:0; } .mag circle { fill:none; stroke:#cfe8ff; stroke-width:1.2; } .mag path { stroke:#cfe8ff; stroke-width:1.5; stroke-linecap:round; }
  .chinpaw { fill:var(--body); stroke:var(--ear); stroke-width:.6; }
  .mug rect, .mug .mh { fill:#e9e3da; } .mug .mh { fill:none; stroke:#e9e3da; stroke-width:1.1; } .mug .steam { fill:none; stroke:#ffffff88; stroke-width:.7; stroke-linecap:round; }
  #mascot[data-mood=working] .body-g { animation:workbob 2.4s ease-in-out infinite; }
  #mascot[data-mood=working] .lap { opacity:1; transform:none; }
  #mascot[data-mood=working] .eye { animation:blinkN 5s infinite; }
  #mascot[data-mood=working] #eyes { animation:lookType 1s linear infinite; }
  #mascot[data-mood=working] .mouth { display:none; }
  #mascot[data-mood=working] .brow, #mascot[data-mood=working] .focusm { opacity:1; }
  #mascot[data-mood=working] .brow, #mascot[data-mood=working] .focusm, #mascot[data-mood=working] .mouth { transform:translateX(2.2px); }
  #mascot[data-mood=working] .glow { opacity:.5; animation:glowp 1.8s ease-in-out infinite; }
  #mascot[data-mood=working] .paw.p1 { animation:type .22s ease-in-out infinite; }
  #mascot[data-mood=working] .paw.p2 { animation:type .22s ease-in-out .11s infinite; }
  #mascot[data-mood=working] .code.c1 { animation:codeup 1.6s ease-out infinite; }
  #mascot[data-mood=working] .code.c2 { animation:codeup 1.6s ease-out .8s infinite; }
  /* ne yaptığına göre duruş: düşünme (çenede pati, kabarcıklar), okuma (gözler satır tarar), arama (büyüteç), komut (terminal), ajan (pırıltı) */
  #mascot[data-mood=working][data-pose=think] #eyes { animation:lookThink 1s linear infinite; }
  #mascot[data-mood=working][data-pose=think] .paw { animation:none; }
  #mascot[data-mood=working][data-pose=think] .code { animation:none; opacity:0; }
  #mascot[data-mood=working][data-pose=think] .think { opacity:1; } #mascot[data-mood=working][data-pose=think] .chinpaw { opacity:1; }
  #mascot[data-mood=working][data-pose=think] .think circle { animation:tpop 1.8s ease-out infinite; }
  #mascot[data-mood=working][data-pose=think] .think circle:nth-child(2) { animation-delay:.3s; } #mascot[data-mood=working][data-pose=think] .think circle:nth-child(3) { animation-delay:.6s; }
  #mascot[data-mood=working][data-pose=read] #eyes, #mascot[data-mood=working][data-pose=screen] #eyes { animation:scan .85s ease-in-out infinite alternate; }
  #mascot[data-mood=working][data-pose=read] .paw, #mascot[data-mood=working][data-pose=screen] .paw { animation:none; }
  #mascot[data-mood=working][data-pose=search] #eyes { animation:lookSearch 1s linear infinite; }
  #mascot[data-mood=working][data-pose=search] .mag { opacity:1; animation:magbob 1.3s ease-in-out infinite; }
  #mascot[data-mood=working][data-pose=search] .brow { transform:translate(2.2px,-1.4px); }
  #mascot[data-mood=working][data-pose=search] .eye { animation:none; transform:scaleY(1); }
  #mascot[data-mood=working][data-pose=run] .code.c1 { animation:none; opacity:0; } #mascot[data-mood=working][data-pose=run] .code.c3 { animation:promptp 2.6s ease-in-out infinite; }
  #mascot[data-mood=working][data-pose=agent] .spark { animation:sparkle 2.4s ease-out infinite; }
  /* çalışırken ara sıra: kameraya bakıp gülümseme, bir yudum, gerinme */
  #mascot[data-mood=working][data-sub=glance] #eyes { animation:lookCam 1s linear infinite; }
  #mascot[data-mood=working][data-sub=glance] .mouth { display:block; transform:none; }
  #mascot[data-mood=working][data-sub=glance] .focusm, #mascot[data-mood=working][data-sub=glance] .brow { opacity:0; }
  #mascot[data-mood=working][data-sub=sip] .mug { opacity:1; animation:sipw 2.2s ease-in-out; }
  #mascot[data-mood=working][data-sub=sip] .eye, #mascot[data-mood=working][data-sub=stretch] .eye { animation:none; transform:scaleY(.16); }
  #mascot[data-mood=working][data-sub=sip] .focusm, #mascot[data-mood=working][data-sub=stretch] .focusm, #mascot[data-mood=working][data-sub=sip] .brow, #mascot[data-mood=working][data-sub=stretch] .brow { opacity:0; }
  #mascot[data-mood=working][data-sub=sip] .mouth { display:block; transform:none; }
  #mascot[data-mood=working][data-sub=stretch] .body-g { animation:stretchw 2.2s ease-in-out; }
  #mascot[data-mood=working][data-sub=stretch] .yawnm { opacity:1; animation:yawnw 2.2s ease-in-out; transform-box:fill-box; transform-origin:center; }
  @keyframes workbob { 0%,100% { transform:translate(-3px,1px) rotate(7deg); } 50% { transform:translate(-3px,1.7px) rotate(8.6deg); } }
  @keyframes stretchw { 0%,100% { transform:translate(-3px,1px) rotate(7deg); } 45%,70% { transform:translate(-1px,-1px) rotate(0) scale(.94,1.12); } }
  @keyframes blinkN { 0%,93%,100% { transform:scaleY(.72); } 96% { transform:scaleY(.1); } }
  @keyframes lookType { 0%,100% { transform:translate(2.6px,1.4px); } }
  @keyframes lookThink { 0%,100% { transform:translate(2.2px,-1.4px); } }
  @keyframes lookSearch { 0%,100% { transform:translate(3.4px,-.8px); } }
  @keyframes lookCam { 0%,100% { transform:translate(0,0); } }
  @keyframes scan { from { transform:translate(.2px,1.6px); } to { transform:translate(4.8px,1.6px); } }
  @keyframes glowp { 50% { opacity:.25; } }
  @keyframes yawnw { 0%,100% { transform:scale(.3); } 40%,70% { transform:scale(1.1,1.35); } }
  @keyframes tpop { 0% { opacity:0; transform:scale(.3); } 25%,70% { opacity:.9; transform:scale(1); } 100% { opacity:0; } }
  @keyframes magbob { 50% { transform:translate(-1px,1.4px) rotate(-6deg); } }
  @keyframes sipw { 0%,100% { transform:translate(0,0) rotate(0); } 30%,70% { transform:translate(8px,-3px) rotate(14deg); } }
  @keyframes type { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-2px); } }
  @keyframes codeup { 0% { opacity:0; transform:translateY(5px); } 30% { opacity:1; } 100% { opacity:0; transform:translateY(-6px); } }
  /* Claude çalışırken adada küçült düğmesi; küçültünce ada kapalı hapa iner, maskot çalışmaya devam eder */
  #minbtn { z-index:5; position:absolute; top:8px; right:12px; width:22px; height:22px; border:0; border-radius:50%; background:#ffffff18; color:#fff; font:700 13px/1 system-ui; cursor:pointer; opacity:0; pointer-events:none; transition:opacity .25s, background .2s; padding:0; }
  #minbtn:hover { background:#ffffff30; }
  #island.claudework.expanded:not(.open):not(.ask) #minbtn { opacity:1; pointer-events:auto; transition-delay:.35s; }
  #island.claudework #content { right:44px; }
  /* maskotun günlük yaşamı: esneme, acıkma, uykulu, su içme */
  .yawnm, .drool, .glass, .food { opacity:0; } .gl { fill:#ffffff40; stroke:#cfe8ff; stroke-width:.8; } .gw { fill:#6cc6ff; }
  .glass { transform-box:fill-box; transform-origin:0% 100%; transition:opacity .25s; }
  #mascot[data-mood=yawn] .mouth, #mascot[data-mood=hungry] .mouth { display:none; }
  #mascot[data-mood=yawn] .yawnm { opacity:1; animation:yawn 2.2s ease-in-out; transform-box:fill-box; transform-origin:center; }
  #mascot[data-mood=yawn] .eye { animation:none; transform:scaleY(.2); }
  #mascot[data-mood=yawn] .body-g { animation:stretch 2.2s ease-in-out; }
  #mascot[data-mood=hungry] .yawnm { opacity:1; transform:scale(.55); transform-box:fill-box; transform-origin:center; }
  #mascot[data-mood=hungry] .drool { opacity:1; animation:drip 1.6s ease-in infinite; }
  #mascot[data-mood=hungry] .food { opacity:1; animation:bob 1.2s ease-in-out infinite; }
  #mascot[data-mood=sleepy] .eye { animation:none; transform:scaleY(.3); }
  #mascot[data-mood=sleepy] .zzz { opacity:1; animation:pulse 2s infinite; }
  #mascot[data-mood=sleepy] .body-g { animation:droop 3s ease-in-out infinite; }
  #mascot[data-mood=drink] .glass { opacity:1; animation:sip 1.6s ease-in-out 1; }
  #mascot[data-mood=drink] .body-g { animation:hop .7s var(--ease) 2; }
  @keyframes yawn { 0%,100% { transform:scale(.3); } 40%,70% { transform:scale(1.5,1.9); } }
  @keyframes stretch { 0%,100% { transform:scale(1); } 45%,70% { transform:scale(.94,1.12); } }
  @keyframes bob { 50% { transform:translateY(-2px); } }
  @keyframes droop { 0%,100% { transform:rotate(0); } 50% { transform:rotate(-5deg) translateY(1px); } }
  @keyframes sip { 0% { transform:rotate(0); } 35%,70% { transform:rotate(-38deg) translate(-3px,-2px); } 100% { transform:rotate(0); } }
  .sadm { display:none; fill:none; stroke:#2a1a24; stroke-width:1.6; stroke-linecap:round; }
  .sweat { fill:#8fd0ff; opacity:0; }
  #mascot[data-mood=sad] .body { fill:#f08a8a; } #mascot[data-mood=sad] .ear { fill:#e07070; }
  #mascot[data-mood=sad] .mouth { display:none; } #mascot[data-mood=sad] .sadm { display:block; }
  #mascot[data-mood=sad] .body-g { animation:none; transform:translateY(1px) rotate(-3deg); }
  #mascot[data-mood=sad] .sweat { animation:drip 1.4s ease-in infinite; }
  @keyframes drip { 0% { opacity:0; transform:translateY(-3px); } 30% { opacity:1; } 100% { opacity:0; transform:translateY(7px); } }
  /* onay düğmeleri (bardan onay) */
  #acts { display:none; gap:8px; margin-top:8px; pointer-events:auto; }
  #acts button { flex:1; border:0; border-radius:10px; padding:6px 0; font:inherit; font-size:12.5px; font-weight:600; color:#fff; background:#ffffff1f; cursor:pointer; }
  #acts button[data-a=allow], #acts button[data-a=answer] { background:#2f9e5b; } #acts button[data-a=deny], #acts button[data-a=reject], #acts button[data-a=hangup] { background:#c84b4b; }
  #acts button:hover { filter:brightness(1.15); }
  #island.ask { height:112px; } #island.ask #acts { display:flex; }
  #replybox { display:none; gap:8px; margin-top:8px; pointer-events:auto; }
  #island.typing #acts { display:none; } #island.typing #replybox { display:flex; }
  #rin { flex:1; min-width:0; background:#ffffff1c; color:#fff; border:1px solid #ffffff30; border-radius:10px; padding:6px 10px; font:inherit; font-size:13px; outline:none; user-select:text; }
  #rin:focus { border-color:var(--body); }
  #rsend { border:0; border-radius:10px; width:34px; background:var(--body); color:#2a1a24; font-size:15px; font-weight:700; cursor:pointer; }
  .clawd { fill:#d97757; opacity:0; transform-box:fill-box; transform-origin:50% 100%; transform:scale(.3) rotate(-12deg); transition:opacity .25s, transform .5s var(--ease); }
  .clawd .ceye { fill:#1a1210; }
  .body-g { transition:opacity .25s, transform .5s var(--ease); }
  .spark { fill:#ffd9a8; opacity:0; transform-box:fill-box; transform-origin:center; }
  #mascot[data-mood=claude] .body-g { animation:none; opacity:0; transform:scale(.3) rotate(12deg); }
  #mascot[data-mood=claude] .clawd { opacity:1; transform:none; animation:clawdHop .6s var(--ease) .35s 2; }
  #mascot[data-mood=claude] .spark { animation:sparkle 1.3s ease-out .1s; }
  @keyframes clawdHop { 40% { transform:translateY(-4px) scale(.94,1.1); } 70% { transform:scale(1.08,.92); } }
  @keyframes sparkle { 0% { opacity:0; transform:scale(.2) rotate(0); } 35% { opacity:1; transform:scale(1.25) rotate(40deg); } 100% { opacity:0; transform:scale(.6) rotate(90deg); } }
  @keyframes breathe { 50% { transform:scale(1.05) translateY(-.5px); } }
  @keyframes breatheBig { 0%,100% { transform:scale(1.55); } 50% { transform:scale(1.6) translateY(-1px); } }
  @keyframes blink { 0%,91%,100% { transform:scaleY(1); } 93% { transform:scaleY(.1); } 95% { transform:scaleY(1); } 97% { transform:scaleY(.1); } }
  @keyframes hop { 0%,100% { transform:translateY(0) scale(1,1); } 40% { transform:translateY(-4px) scale(.94,1.1); } 70% { transform:translateY(0) scale(1.08,.92); } }
  @keyframes wiggle { 25% { transform:rotate(-8deg); } 75% { transform:rotate(8deg); } }

  /* medya */
