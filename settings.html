<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><title>Ayarlar</title>
<style>
  body { margin:0; padding:26px 28px 32px; background:#14121a; color:#f3eef8; font-family:"Segoe UI Variable","Segoe UI",system-ui,sans-serif; user-select:none; }
  h1 { font-size:20px; margin:0 0 6px; font-weight:650; }
  h2 { font-size:13px; font-weight:600; color:#b9b0c8; margin:26px 0 10px; }
  #sw { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:10px; }
  .sw { width:36px; height:36px; border-radius:50%; border:3px solid transparent; cursor:pointer; transition:transform .25s cubic-bezier(.34,1.5,.5,1); }
  .sw:hover { transform:scale(1.12); } .sw.on { border-color:#fff; }
  .opt { display:flex; gap:12px; align-items:flex-start; padding:11px 14px; margin-bottom:8px; border-radius:14px; background:#1f1c29; cursor:pointer; border:1px solid transparent; transition:border-color .2s, background .2s; }
  .opt:hover { background:#262233; } .opt:has(input:checked) { border-color:#ffc2d9; }
  .opt input { margin-top:3px; accent-color:#ffadcc; }
  .opt b { display:block; font-size:14px; font-weight:600; } .opt span { font-size:12.5px; color:#b9b0c8; line-height:1.4; }
  .row2 { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:6px 2px 10px; font-size:14px; } .row2.col { flex-direction:column; align-items:stretch; gap:8px; }
  .row2 input[type=range] { width:190px; accent-color:#ffadcc; }
  textarea { resize:vertical; }
  select, input[type=text], input[type=password], input[type=time], input[type=date], textarea { background:#1f1c29; color:#f3eef8; border:1px solid #332f42; border-radius:10px; padding:8px 10px; font:inherit; font-size:13px; }
  input[type=color] { width:44px; height:32px; padding:0; border:1px solid #332f42; border-radius:10px; background:#1f1c29; cursor:pointer; }
  .seg { display:flex; gap:8px; } .seg label { flex:1; cursor:pointer; } .seg input { display:none; }
  .seg span { display:block; text-align:center; padding:10px; border-radius:12px; background:#1f1c29; font-size:13px; border:1px solid transparent; transition:border-color .2s, background .2s; }
  .seg input:checked + span { border-color:#ffc2d9; background:#262233; }
  .btn { margin-top:12px; width:100%; padding:11px; border:0; border-radius:14px; background:#1f1c29; color:#f3eef8; font:inherit; font-weight:600; cursor:pointer; } .btn:hover { background:#262233; }
  #tabs { position:sticky; top:0; z-index:5; display:flex; gap:4px; margin:14px -8px 6px; padding:8px; background:#14121aee; backdrop-filter:blur(8px); }
  .tb { flex:1; padding:9px 4px; border:0; border-radius:12px; background:transparent; color:#b9b0c8; font:inherit; font-size:13px; cursor:pointer; transition:background .2s, color .2s; }
  .tb:hover { background:#1f1c29; } .tb.on { background:#ffc2d9; color:#2a1a24; font-weight:650; }
  section[data-tab] > h2:first-child { margin-top:12px; }
  small { color:#b9b0c8; font-size:12px; line-height:1.4; display:block; margin:-2px 2px 10px; }
</style></head><body>

  const TABS = [['look', 'Görünüm'], ['behave', 'Davranış'], ['pages', 'Panel'], ['notify', 'Bildirimler'], ['apps', 'Bağlantılar'], ['backup', 'Yedek']];
  const secs = {}; let curTab = 'look';
  [...root.children].forEach((el) => {
    if (el.tagName === 'H2') curTab = TAB[el.textContent] || curTab;
    if (!secs[curTab]) { secs[curTab] = document.createElement('section'); secs[curTab].dataset.tab = curTab; }
    secs[curTab].append(el);
  });
  const bk = document.createElement('section'); bk.dataset.tab = 'backup'; bk.append(...document.getElementById('backup').children); secs.backup = bk;
  document.getElementById('backup').remove();
  root.replaceChildren(...TABS.map(([t]) => secs[t]).filter(Boolean));
  const showTab = (t) => {
    document.querySelectorAll('#tabs .tb').forEach((b) => b.classList.toggle('on', b.dataset.t === t));
    Object.entries(secs).forEach(([k, s]) => { s.hidden = k !== t; });
    scrollTo(0, 0);
  };
  const tabs = document.getElementById('tabs');
  TABS.forEach(([t, name]) => { const b = document.createElement('button'); b.className = 'tb'; b.dataset.t = t; b.textContent = name; b.onclick = () => showTab(t); tabs.append(b); });
  showTab('look');

  const sw = document.getElementById('sw');
  Object.entries(PALETTE).forEach(([k, p]) => {
    const b = document.createElement('button'); b.className = 'sw'; b.title = p[0]; b.dataset.c = k; b.style.background = p[1];
    b.onclick = () => dynbar.setSettings({ color: k, accent: '' }); sw.append(b);
  });
  let cur = {};
  const apply = (s) => {
    cur = s;
    document.querySelectorAll('.sw').forEach((b) => b.classList.toggle('on', !s.accent && b.dataset.c === s.color));
    document.querySelectorAll('[data-k]').forEach((el) => {
      const v = s[el.dataset.k];
      if (el.type === 'checkbox') el.checked = !!v;
      else if (el.type === 'radio') el.checked = String(v) === el.value;
      else if (el.type === 'color') el.value = v || (PALETTE[s.color] || PALETTE.pink)[1];
      else el.value = v ?? '';
    });
  };
  root.addEventListener('change', (e) => {
    const el = e.target, k = el.dataset.k; if (!k) return;
    let v = el.type === 'checkbox' ? el.checked : el.dataset.num !== undefined ? +el.value : el.value.trim();
    if (k === 'clock24') v = el.value === 'true';
    dynbar.setSettings({ [k]: v });
  });
  document.getElementById('accclr').onclick = () => dynbar.setSettings({ accent: '' });
  document.getElementById('test').onclick = () => dynbar.test();
  const KBD = { ok: '✓ Legion Toolkit bağlı, klavye ışığı kontrol edilebiliyor.', missing: 'Legion Toolkit bulunamadı. Bu özellik yalnızca Lenovo Legion ve LOQ dizüstülerde, Legion Toolkit kuruluyken çalışır.',
    stopped: 'Legion Toolkit çalışmıyor ya da ayarlarında "CLI" kapalı. Toolkit’i aç, Ayarlar’dan CLI’yi etkinleştir.', unsupported: 'Bu cihazda beyaz klavye ışığı kontrolü desteklenmiyor.', error: 'Klavye ışığı okunamadı.' };
  const kbdStat = async () => { try { document.getElementById('kbdstat').textContent = KBD[await dynbar.invoke('kbd:status')] || ''; } catch {} };
  document.getElementById('kbdtest').onclick = () => { dynbar.send('kbd:test'); setTimeout(kbdStat, 2500); };
  kbdStat();
  document.getElementById('gentok').onclick = () => { const a = new Uint8Array(12); crypto.getRandomValues(a); dynbar.setSettings({ apiToken: [...a].map((x) => x.toString(16).padStart(2, '0')).join('') }); };
  const flash = (id, t) => { const b = document.getElementById(id), o = b.textContent; b.textContent = t; setTimeout(() => (b.textContent = o), 1600); };
  document.getElementById('exp').onclick = async () => { const { todos, apiToken, ...rest } = cur; try { await navigator.clipboard.writeText(JSON.stringify(rest)); flash('exp', 'Kopyalandı ✓'); } catch { flash('exp', 'Kopyalanamadı'); } };
  document.getElementById('imp').onclick = async () => {
    try { const o = JSON.parse(await navigator.clipboard.readText()); if (!o || typeof o !== 'object') throw 0; const { todos, apiToken, ...rest } = o; dynbar.setSettings(rest); flash('imp', 'Yüklendi ✓'); } catch { flash('imp', 'Panoda geçerli ayar yok'); }
  };
  document.getElementById('reset').onclick = () => { if (confirm('Tüm ayarlar varsayılana dönsün mü?')) dynbar.send('settings:reset'); };
  dynbar.onSettings(apply); dynbar.getSettings().then(apply);
})();
</script></body></html>
