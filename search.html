<!doctype html>
<html lang="tr"><head><meta charset="utf-8">
<style>
  :root { --spring: linear(0.0, 0.0122, 0.0453, 0.095, 0.1569, 0.2275, 0.3034, 0.3819, 0.4608, 0.538, 0.6122, 0.682, 0.7466, 0.8055, 0.8583, 0.9048, 0.9452, 0.9795, 1.0081, 1.0313, 1.0496, 1.0634, 1.0732, 1.0795, 1.0828, 1.0835, 1.0821, 1.0791, 1.0748, 1.0694, 1.0634, 1.0571, 1.0505, 1.0439, 1.0375, 1.0313, 1.0256, 1.0203, 1.0154, 1.0111, 1); --spring-soft: linear(0.0, 0.0077, 0.0287, 0.0604, 0.1004, 0.1464, 0.1968, 0.2501, 0.3048, 0.36, 0.4146, 0.4681, 0.5198, 0.5693, 0.6162, 0.6603, 0.7015, 0.7396, 0.7747, 0.8068, 0.836, 0.8623, 0.8859, 0.9069, 0.9255, 0.9418, 0.956, 0.9683, 0.9789, 0.9878, 0.9953, 1.0016, 1.0066, 1.0107, 1.0138, 1.0162, 1.0179, 1.019, 1.0197, 1.0199, 1);
    --bg:#000; --bga:100; --acc:#ffc2d9; --top:10px; --ui:1; --sh:0 6px 24px rgba(0,0,0,.45); --fg2:rgba(255,255,255,.52); }
  html,body { margin:0; height:100%; background:transparent; overflow:hidden; font-family:"Segoe UI Variable","Segoe UI",system-ui,sans-serif; color:#fff; user-select:none; }
  #stage { position:absolute; left:50%; top:0; width:0; height:0; transform:scale(var(--ui)); transform-origin:0 0; }
  /* ada ile aynı konum ve boyuttan başlar, yay gibi açılır */
  #pill { position:absolute; top:var(--top); left:0; transform:translateX(-50%); width:112px; height:36px; border-radius:18px; overflow:hidden;
    background:color-mix(in srgb, var(--bg) calc(max(var(--bga), 92) * 1%), transparent); box-shadow:var(--sh);
    transition: width .8s var(--spring), height .6s var(--spring-soft), border-radius .6s var(--spring-soft); }
  #pill.open { width:560px; border-radius:30px; }
  body[data-mode=dock] #pill { top:0; border-radius:0 0 18px 18px; }
  body[data-mode=dock] #pill.open { border-radius:0 0 30px 30px; }
  /* açılış bitince yükseklik yaysız, kısa geçişle değişir (her tuşta liste zıplamasın) */
  #pill.settled { transition: width .8s var(--spring), height .24s cubic-bezier(.22,.9,.3,1), border-radius .6s var(--spring-soft); }
  /* kapanış: hap adanın boyutuna iner (soluklaşmaz); altta ada geri gelir, hap en son kaldırılır ve ikisi aynı görünür */
  #pill.closing { width:112px !important; height:36px !important; border-radius:18px; transition: width .3s cubic-bezier(.4,0,.2,1), height .3s cubic-bezier(.4,0,.2,1), border-radius .3s; }
  body[data-mode=dock] #pill.closing { border-radius:0 0 18px 18px; }
  /* içerik hapın ortasına sabit: hap büyürken kenarlardan kırpılmadan ortadan açılır; yazı hap genişleyince bulanıklıktan çıkar */
  #inner { position:absolute; left:50%; top:0; width:560px; margin-left:-280px; opacity:0; filter:blur(6px); transition: opacity .15s, filter .15s; }
  #pill.open #inner { opacity:1; filter:none; transition: opacity .3s .22s, filter .4s .22s; }
  #pill.closing #inner { opacity:0; filter:none; transition: opacity .1s; }

  #bar { position:relative; height:64px; display:flex; align-items:center; gap:12px; padding:0 22px; }
  #mag { flex:none; color:var(--fg2); }
  #q { flex:1; min-width:0; background:none; border:0; outline:0; color:#fff; font:300 22px "Segoe UI Variable Display","Segoe UI",system-ui,sans-serif; caret-color:var(--acc); }
  #q::placeholder { color:var(--fg2); }
  #status { font-size:12px; color:var(--fg2); white-space:nowrap; }
  #list { max-height:400px; overflow-y:auto; padding:0 10px 8px; border-top:.5px solid rgba(255,255,255,.1); }
  #list:empty { display:none; }
  #list::-webkit-scrollbar { width:0; }
  .group { font-size:12px; font-weight:600; color:var(--fg2); padding:10px 10px 4px; }
  .row { display:flex; align-items:center; gap:12px; height:44px; padding:0 10px; border-radius:12px; }
  .row .ic { width:28px; height:28px; flex:none; object-fit:contain; }
  .row .text { flex:1; min-width:0; display:flex; flex-direction:column; justify-content:center; }
  .row .name { font-size:14px; line-height:1.25; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .row .sub { font-size:11.5px; line-height:1.25; color:var(--fg2); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; direction:rtl; text-align:left; }
  .row .kind { font-size:12px; color:var(--fg2); white-space:nowrap; }
  .row .ret { width:16px; text-align:center; font-size:13px; color:transparent; }
  .row.top { height:58px; }
  .row.top .ic { width:40px; height:40px; }
  .row.top .name { font-size:16px; font-weight:500; }
  .row { transition: background .14s ease; }
  .row.sel { background:color-mix(in srgb, var(--acc) 30%, transparent); }
  /* sonuçlar boş listeden ilk geldiğinde sırayla hafifçe yukarı kayarak belirir (her tuşta değil, titreme olmasın) */
  .enter { animation: rowin .26s cubic-bezier(.22,.9,.3,1) both; }
  @keyframes rowin { from { opacity:0; transform:translateY(7px); } to { opacity:1; transform:none; } }
  #footer.enter { animation-name: fadein; animation-duration:.3s; }
  @keyframes fadein { from { opacity:0; } to { opacity:1; } }
  .row.sel .ret { color:#fff; }
  #footer { display:flex; gap:16px; align-items:center; justify-content:center; height:32px; border-top:.5px solid rgba(255,255,255,.1); font-size:11.5px; color:var(--fg2); }
  #footer[hidden] { display:none; }
  #footer kbd { font:inherit; font-size:11px; padding:1px 6px; margin-right:5px; border-radius:5px; background:rgba(255,255,255,.12); }
  @media (prefers-reduced-motion: reduce) { #pill, #inner { transition-duration:.01s; } }
</style></head>
<body>
<div id="stage"><div id="pill"><div id="inner">
  <div id="bar">
    <svg id="mag" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></svg>
    <input id="q" type="text" spellcheck="false" autocomplete="off">
    <span id="status"></span>
  </div>
  <div id="list"></div>
  <div id="footer" hidden></div>
</div></div></div>
<script src="palette.js"></script>
<script src="search.js"></script>
</body></html>
